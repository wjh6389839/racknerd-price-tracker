- name: 5. 提交数据与走势图
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 【更新点】替换原 git add 命令：健壮检查文件存在性后再添加
          [ -f price_history.csv ] && git add price_history.csv || echo "price_history.csv 不存在，跳过添加。"
          [ -f price_trend.png ] && git add price_trend.png || echo "price_trend.png 不存在，跳过添加。"
          
          # 【更新点】替换原 if 判断：确保同时检查文件确实存在，不仅仅是内容没变
          # 这个更复杂的逻辑能同时处理新数据更新或因爬取失败导致文件未生成的情况
          if git diff --staged --quiet; then
            echo "今日无数据变动，无需提交。"
          else
            # 如果脚本正常生成文件但价格没变，上面 git diff 会静默成功，不会进到这里
            # 只有当确实有新文件或文件修改被暂存时，才会执行 commit
            git commit -m "Auto: Update RackNerd lowest price [$(date +'%Y-%m-%d')]"
            git push
          fi
