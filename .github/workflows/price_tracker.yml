name: RackNerd Price Tracker

on:
  schedule:
    # 每天定时运行（UTC时间 00:30 和 12:30，对应北京时间 08:30 和 20:30）
    - cron: '4 2 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点击运行

permissions:
  contents: write # 赋予自动提交代码和图片的权限

jobs:
  track-racknerd:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib pandas curl_cffi beautifulsoup4

      - name: 4. 执行比价与推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python tracker.py

      - name: 5. 提交数据与走势图
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update RackNerd price data [skip ci]" && git pull --rebase && git push)
